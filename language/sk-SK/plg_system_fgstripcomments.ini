PLG_SYSTEM_FGSTRIPCOMMENTS_FIELD_SUPPORT_DESC="<div class='alert alert-info d-flex align-items-center justify-content-between flex-wrap gap-3 mb-0'><div><strong>Tento plugin je bezplatný a open source.</strong> Ak vám ušetril čas, dobrovoľný jednorazový príspevok na Ko-fi je vítaný, no úplne voliteľný – žiadna funkcia tu nie je nikdy uzamknutá za platbou.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer'>Ďalšie FG rozšírenia</a></div></div>"
