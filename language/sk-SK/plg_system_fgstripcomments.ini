PLG_SYSTEM_FGSTRIPCOMMENTS_FIELD_SUPPORT_DESC="<strong>FG Strip Comments</strong> je bezplatný a open source, súčasť série FG rozšírení pre Joomlu. Ak vám ušetril čas, dobrovoľný jednorazový príspevok na Ko-fi je vítaný, no úplne voliteľný – žiadna funkcia tu nie je nikdy uzamknutá za platbou.<br><br><a href=&quot;https://ko-fi.com/fgcodework&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;>&#9749; Podporiť na Ko-fi</a> &middot; <a href=&quot;https://fgcodework.github.io/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;>Ďalšie FG pluginy</a>"
