PLG_SYSTEM_FGSTRIPCOMMENTS="System - FG Strip Comments"
PLG_SYSTEM_FGSTRIPCOMMENTS_XML_DESCRIPTION="Odstraňuje značky ako {-- poznámka --} z vykresleného výstupu na fronte (titulky modulov, článkov, položky menu a pod.), pričom v administrácii zostávajú viditeľné. Moderná náhrada starého pluginu BIGSHOT Strip Comments pre Joomla 6."
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_LABEL="Rozsah"
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_DESC="Kde sa majú značky odstraňovať. „Len titulky“ ich odstráni v nadpisoch (h1–h6), v titulku stránky a v texte odkazov (položky menu, drobečková navigácia), takže telo článku sa nikdy nezmení. „Celá stránka“ ich odstráni všade vo výstupe okrem blokov &lt;script&gt; a &lt;style&gt;, ktoré sa nikdy neupravujú."
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_ALL="Celá stránka"
PLG_SYSTEM_FGSTRIPCOMMENTS_SCOPE_TITLES="Len titulky (nadpisy, titulok stránky a odkazy)"
PLG_SYSTEM_FGSTRIPCOMMENTS_OPEN_DELIM_LABEL="Otvárací oddeľovač"
PLG_SYSTEM_FGSTRIPCOMMENTS_OPEN_DELIM_DESC="Začiatočná značka. Všetko od nej po zatváraciu značku sa na fronte odstráni. Predvolené: {--"
PLG_SYSTEM_FGSTRIPCOMMENTS_CLOSE_DELIM_LABEL="Zatvárací oddeľovač"
PLG_SYSTEM_FGSTRIPCOMMENTS_CLOSE_DELIM_DESC="Koncová značka. Predvolené: --}"
PLG_SYSTEM_FGSTRIPCOMMENTS_RUN_ADMIN_LABEL="Spustiť aj v administrácii"
PLG_SYSTEM_FGSTRIPCOMMENTS_RUN_ADMIN_DESC="Ak je zapnuté, značky sa odstránia aj v administrácii. Predvolene vypnuté, aby si svoje poznámky v backende stále videl."
